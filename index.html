<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- TARAYICI ÇUBUĞU RENGİ -->
    <meta name="theme-color" content="#000000">
    
    <!-- WEB APP AYARLARI -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    
    <title>Radyo Dinle Canlı - Alle Zenders</title>
    
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script async src="../pagead/js/f.txt?client=ca-pub-8223219567911117" crossorigin="anonymous"></script>

    <style>
        /* Basis Styling */
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            
            /* KOPYALAMA ENGELİ */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* --- SİYAH GİRİŞ PERDESİ --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }
        
        /* RESİM AYARLARI (BÜYÜK) */
        #start-image {
            width: 200px; 
            height: 200px;
            margin-bottom: 40px;
            border-radius: 20px;
            object-fit: contain;
            /* Resim yüklenemezse belli olsun diye gri arka plan */
            background-color: #1a1a1a; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* BUTON AYARLARI (SİYAH/GRİ) */
        .start-btn {
            padding: 18px 50px;
            background-color: #1a1a1a; 
            color: #ffffff; 
            border: 2px solid #ffffff; 
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.95);
            background-color: #333;
        }
        /* ---------------------------------------- */

        main {
            flex: 1 0 auto;
            padding-bottom: 70px; 
        }

        /* Horizontaal Menu - TRANSPARANT */
        .menu {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            overflow-x: auto;
            background-color: transparent; 
            padding: 12px;
            gap: 15px;
        }
        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
        }

        /* Header & Zoekveld */
        #header {
            padding: 15px;
            text-align: center;
            background: #1a1a1a;
            position: sticky;
            top: 45px;
            z-index: 99; 
        }

        .arainput {
            width: 90%;
            max-width: 400px;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #000;
            color: white;
            outline: none;
        }

        /* Player Sectie */
        .player-container {
            background: #1a1a1a;
            border-bottom: 2px solid #ff3366;
            padding: 8px 15px;
            position: sticky;
            top: 100px; 
            z-index: 98;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }
        .current-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .current-logo {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            border: 1px solid #ff3366;
            flex-shrink: 0;
            background-color: #000; 
            object-fit: contain; 
        }
        .now-playing-text {
            text-align: left;
        }

        /* YAZI BOYUTLARI (BÜYÜK) */
        #now-playing-name {
            font-weight: bold;
            font-size: 20px; 
            max-width: 200px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #status {
            font-size: 14px; 
            color: #ff3366;
            margin-top: 3px;
        }
        /* --------------------------------------------------- */

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .controls img {
            width: 45px; 
            height: 45px; 
            cursor: pointer;
            transition: transform 0.1s;
        }
        .controls img:active {
            transform: scale(0.9);
        }
        
        /* Radio Grid */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            padding: 10px;
        }
        .radio-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            scroll-margin-top: 180px; 
        }
        .radio-card:hover {
            border-color: #ff3366;
            background: #252525;
        }

        /* AKTİF KART STİLİ (Kalıcı Kırmızı Çerçeve) */
        .radio-card.active-card {
            border: 2px solid #ff3366 !important; 
            background-color: #252525;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }

        .radio-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 4px;
            background: #000;
            object-fit: contain; 
            display: block;
        }
        
        /* Yeni Alt Kısım Düzeni */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            margin-top: 5px;
            gap: 2px;
        }

        .radio-name {
            font-size: 11px;
            color: #A3E0FF;
            height: 28px;
            overflow: hidden;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center; 
            flex-grow: 1; 
            text-align: center;
        }
        
        /* FAVORİ YILDIZ VE YANIP SÖNME ANİMASYONU */
        @keyframes blinker {
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .favorite-star {
            font-size: 22px; 
            color: #FFD700; 
            cursor: pointer;
            padding-left: 5px;
            line-height: 1;
            text-shadow: 0 0 2px black; 
        }

        .star-blinking {
            animation: blinker 1.5s linear infinite;
        }

        /* Footer */
        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 101; 
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666;
            background-color: #1a1a1a; 
            box-shadow: 0 -2px 5px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <!-- SİYAH GİRİŞ EKRANI -->
    <div id="start-overlay">
        <!-- Logo Yolu: Kendi klasör yapına uygun (Logolar/resim.webp) -->
        <!-- Eğer giriş logom da gelmiyor dersen: "image/katplay.png" dosyasının orada olduğundan emin ol -->
        <img id="start-image" src="image/katplay.png" alt="Logo">
        
        <button class="start-btn" onclick="enterApp()">Uygulamaya Giriş</button>
    </div>

    <main>
        <div class="menu">
            <a href="javascript:void(0)" onclick="filterCategory('All')">Hepsi</a>
            <a href="javascript:void(0)" onclick="showFavorites()">Favorilerim</a>
            <a href="javascript:void(0)" onclick="filterCategory('Arabesk')">Arabesk</a>
            <a href="javascript:void(0)" onclick="filterCategory('Pop')">Pop</a>
            <a href="javascript:void(0)" onclick="filterCategory('Haber')">Haber</a>
            <a href="javascript:void(0)" onclick="filterCategory('Dini')">Dini</a>
        </div>

        <div id="header">
            <input type="text" id="searchInput" class="arainput" placeholder="Radyo Ara..." onkeyup="searchRadio()">
        </div>

        <div class="player-container">
            <div class="current-info">
                <img id="now-playing-logo" src="image/katplay.png" class="current-logo">
                <div class="now-playing-text">
                    <div id="now-playing-name">Kanal Seçiniz</div>
                    <div id="status">Gereed</div>
                </div>
            </div>
            <div class="controls">
                <img src="https://img.icons8.com/ios-filled/50/4CAF50/play--v1.png" id="btn-play" onclick="togglePlay()" alt="Play">
                <img src="https://img.icons8.com/ios-filled/50/FFC107/pause--v1.png" id="btn-pause" onclick="togglePlay()" alt="Pause" style="display:none;">

            </div>
        </div>

        <div class="radio-grid" id="radioGrid">
            <!-- De radio's worden hier door JavaScript ingeladen -->
        </div>
    </main>

    <div id="footer">
        Tüm Hakları Saklıdır © Turis Tv 2024
    </div>

    <script>
        // GLOBAL DEĞİŞKENLER
        let currentStationId = null;
        let currentHowl = null;
        let isNavigatingAway = false;

        // --- 1. GİRİŞ VE TARİHÇE AYARLARI ---
        function enterApp() {
            var elem = document.documentElement;
            
            // Tarihçeye 'sahte' bir kayıt ekle
            history.pushState({page: 'app'}, null, location.href);

            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {});
            } else if (elem.webkitRequestFullscreen) { 
                elem.webkitRequestFullscreen();
            }

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);

            if (!currentHowl) {
                if (stations.length > 0) {
                    playStation(stations[0]); 
                }
            } else {
                setTimeout(() => {
                    if (currentStationId) {
                        const activeCard = document.getElementById('card-' + currentStationId);
                        if (activeCard) {
                            activeCard.scrollIntoView({behavior: "smooth", block: "center"});
                        }
                    }
                }, 350);
            }
        }

        // --- 2. GERİ TUŞU KONTROLÜ (DÜZELTİLDİ) ---
        // Geri tuşuna basınca siyah ekran gelmesin, direkt menüye gitsin.
        window.onpopstate = function(event) {
            isNavigatingAway = true; 
            if (currentHowl) { currentHowl.stop(); }
            // DİREKT MENÜYE GİT
            window.location.replace("https://turistvmenu.pages.dev/");
        };

        // --- 3. UYKU MODU DÜZELTMESİ ---
        function handleFullscreenExit() {
            if (isNavigatingAway) return; // Geri tuşuna basıldıysa karışma
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Sadece uyku modu/ekran kilidi sebebiyle çıktıysa Siyah Ekranı getir
                const overlay = document.getElementById('start-overlay');
                overlay.style.display = 'flex';
                setTimeout(() => {
                   overlay.style.opacity = '1';
                }, 10);
            }
        }
        document.addEventListener('fullscreenchange', handleFullscreenExit);
        document.addEventListener('webkitfullscreenchange', handleFullscreenExit);

        // --- 4. SAĞ TIK ENGELİ ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- RADYO SİSTEMİ ---
        // NOT: Resim yolları "Logolar/resim.webp" formatında.
        // Bu, index.html dosyasının yanında "Logolar" klasörü varsa %100 çalışır.
        const stations = [
            { id: 1, name: "A Haber Radyo", logo: "Logolar/a-haber-radyo.webp", url: "https://turkmedya.radyotvonline.net/turkmedya/ahaberradyo.m3u8", cat: "Haber" },
            { id: 2, name: "A News Radio", logo: "Logolar/a-news-radio.webp", url: "YOUR_STREAM_URL_HERE", cat: "Haber" },
            { id: 3, name: "A Para Radyo", logo: "Logolar/a-para-radyo-dinle.webp", url: "YOUR_STREAM_URL_HERE", cat: "Haber" },
            { id: 4, name: "A Spor Radyo", logo: "Logolar/a-spor-radyo.webp", url: "YOUR_STREAM_URL_HERE", cat: "Spor" },
            { id: 5, name: "Adana FM", logo: "Logolar/adana-fm.webp", url: "https://host.onlineradyotv.net:2020/stream/adanafm", cat: "Arabesk" },
            { id: 6, name: "Radyo Güney", logo: "Logolar/adana-radyo-guney.webp", url: "https://stream.radyolarburada.com/radio/8250/stream", cat: "Arabesk" },
            { id: 7, name: "Adıyaman Life", logo: "Logolar/adiyaman-radyo-life.webp", url: "http://yayin2.canliyayin.org:8698/;*.mp3", cat: "Arabesk" },
            { id: 8, name: "Adıyamanın Sesi", logo: "Logolar/adiyamanin-sesi-radyosu.webp", url: "YOUR_STREAM_URL_HERE", cat: "Arabesk" },
            { id: 9, name: "Adyu FM", logo: "Logolar/adyu.webp", url: "https://www.dijiradyo.com/adyufm", cat: "Arabesk" },
            { id: 10, name: "Afyon Armoni", logo: "Logolar/afyon-armoni-fm.webp", url: "https://www.dijiradyo.com/afyonarmonifm", cat: "Arabesk" },
            { id: 11, name: "Afyon Gün FM", logo: "Logolar/afyon-gun-fm.webp", url: "https://www.dijiradyo.com/afyongunfm", cat: "Arabesk" },
            { id: 12, name: "Afyon Radyo Tek", logo: "Logolar/afyon-radyo-tek.webp", url: "YOUR_STREAM_URL_HERE", cat: "Arabesk" },
            { id: 13, name: "Radyo Sultan", logo: "Logolar/afyon-radyoo-sultan.webp", url: "YOUR_STREAM_URL_HERE", cat: "Arabesk" },
            { id: 14, name: "Akra FM", logo: "Logolar/akra-fm.webp", url: "YOUR_STREAM_URL_HERE", cat: "Dini" }
        ];

        function getFavorites() {
            const favs = localStorage.getItem('favoriteStations');
            return favs ? JSON.parse(favs) : [];
        }

        function saveFavorites(favs) {
            localStorage.setItem('favoriteStations', JSON.stringify(favs));
        }

        function toggleFavorite(stationId, event) {
            event.stopPropagation();
            let favorites = getFavorites();
            
            if (favorites.includes(stationId)) {
                favorites = favorites.filter(id => id !== stationId);
                const starEl = document.getElementById(`star-${stationId}`);
                if (starEl) {
                    starEl.innerText = '☆';
                    starEl.classList.remove('star-blinking'); 
                }
            } else {
                favorites.push(stationId);
                const starEl = document.getElementById(`star-${stationId}`);
                if (starEl) {
                    starEl.innerText = '★';
                    starEl.classList.add('star-blinking'); 
                }
            }
            saveFavorites(favorites);
        }

        function showFavorites() {
            const favoriteIds = getFavorites();
            const favoriteStations = stations.filter(s => favoriteIds.includes(s.id));
            displayStations(favoriteStations);
        }

        function displayStations(targetStations) {
            const grid = document.getElementById('radioGrid');
            const favorites = getFavorites();
            grid.innerHTML = '';
            
            if (targetStations.length === 0) {
                grid.innerHTML = '<p style="color: #999; grid-column: 1 / -1; text-align: center;">Geen zenders gevonden.</p>';
                return;
            }
            targetStations.forEach(station => {
                const isFavorite = favorites.includes(station.id);
                const animClass = isFavorite ? 'star-blinking' : '';
                const isActive = (station.id === currentStationId);
                const activeCardClass = isActive ? 'active-card' : '';

                const card = document.createElement('div');
                card.className = `radio-card ${activeCardClass}`; 
                card.id = 'card-' + station.id;
                
                card.onclick = () => playStation(station);
                
                card.innerHTML = `
                    <img src="${station.logo}" alt="${station.name}" loading="lazy">
                    <div class="card-footer">
                        <div class="radio-name">${station.name}</div>
                        <div id="star-${station.id}" class="favorite-star ${animClass}" onclick="toggleFavorite(${station.id}, event)">${isFavorite ? '★' : '☆'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        function playStation(station) {
            currentStationId = station.id;

            const allCards = document.querySelectorAll('.radio-card');
            allCards.forEach(c => c.classList.remove('active-card'));

            const activeCard = document.getElementById('card-' + station.id);
            if (activeCard) {
                activeCard.classList.add('active-card');
            }

            if (currentHowl) {
                currentHowl.stop();
                currentHowl.unload();
            }

            document.getElementById('now-playing-logo').src = station.logo;
            document.getElementById('now-playing-name').innerText = station.name;
            document.getElementById('status').innerText = "Yükleniyor...";

            currentHowl = new Howl({
                src: [station.url],
                html5: true,
                onplay: () => {
                    document.getElementById('status').innerText = "Çalıyor";
                    document.getElementById('btn-play').style.display = "none";
                    document.getElementById('btn-pause').style.display = "inline";
                },
                onpause: () => {
                    document.getElementById('status').innerText = "Duraklatıldı";
                    document.getElementById('btn-play').style.display = "inline";
                    document.getElementById('btn-pause').style.display = "none";
                },
                onstop: () => {
                    document.getElementById('status').innerText = "Durduruldu";
                    document.getElementById('btn-play').style.display = "inline";
                    document.getElementById('btn-pause').style.display = "none";
                },
                onloaderror: () => {
                    document.getElementById('status').innerText = "Hata: Bağlanamadı";
                }
            });

            currentHowl.play();
        }

        function togglePlay() {
            if (!currentHowl) return;
            if (currentHowl.playing()) {
                currentHowl.pause();
            } else {
                currentHowl.play();
            }
        }

        function stopRadio() {
            if (currentHowl) {
                currentHowl.stop();
            }
        }

        function searchRadio() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = stations.filter(s => s.name.toLowerCase().includes(query));
            displayStations(filtered);
        }

        function filterCategory(cat) {
            if (cat === 'All') {
                displayStations(stations);
            } else {
                const filtered = stations.filter(s => s.cat === cat);
                displayStations(filtered);
            }
        }

        displayStations(stations);
    </script>
</body>
</html>
